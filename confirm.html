<body>
    <div class="box">

    <script>
        // Supabase's "Confirm signup" email lands here with the tokens in the
        // URL fragment (#access_token=...&type=signup) or, on newer projects,
        // as ?code=... (PKCE). Either way we simply finish the sign-in and send
        // the member to their dashboard. If there is nothing to confirm, the
        // button above still works for anyone already signed in.
        const SUPABASE_URL = 'https://clwgengvcdokdzubdfxd.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsd2dlbmd2Y2Rva2R6dWJkZnhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MTIxNjEsImV4cCI6MjA5MzQ4ODE2MX0.0zgizWWXLIHiKdNUAJ3yKaIaxEKsHoFeEIo8IUAMtHU';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        (async function () {
            var hash = window.location.hash || '';
            var search = window.location.search || '';
            try {
                if (hash.indexOf('access_token=') > -1) {
                    var params = new URLSearchParams(hash.replace(/^#/, ''));
                    if (params.get('access_token')) {
                        await supabaseClient.auth.setSession({
                            access_token: params.get('access_token'),
                            refresh_token: params.get('refresh_token') || ''
                        });
                    }
                } else if (search.indexOf('code=') > -1) {
                    await supabaseClient.auth.exchangeCodeForSession(window.location.href);
                }
            } catch (e) {
                console.warn('[confirm] could not complete the sign-in:', e && e.message);
                return;
            }
            // Clean the token out of the address bar before anyone screenshots it.
            try { history.replaceState(null, '', location.pathname); } catch (e) { }
        })();
    </script>
