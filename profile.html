    <script>
        // ─── Configuration ──────────────────────────────────────────────
        const SUPABASE_URL = 'https://clwgengvcdokdzubdfxd.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsd2dlbmd2Y2Rva2R6dWJkZnhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MTIxNjEsImV4cCI6MjA5MzQ4ODE2MX0.0zgizWWXLIHiKdNUAJ3yKaIaxEKsHoFeEIo8IUAMtHU';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        window.supabaseClient = supabaseClient;

        let currentUser = null;
        let currentProfile = null;

        // ─── Toast helper ──────────────────────────────────────────────
        let toastTimer = null;
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.style.display = 'block';
            // Overlapping toasts used to fight each other's timers.
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toast.style.display = 'none'; }, 5000);
        }

        // ─── Sidebar toggle ────────────────────────────────────────────
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (window.innerWidth <= 768) {
                sidebar.classList.toggle('open');
            } else {
                sidebar.classList.toggle('collapsed');
                localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
            }
        }

        if (window.innerWidth > 768 && localStorage.getItem('sidebarCollapsed') === 'true') {
            document.getElementById('sidebar').classList.add('collapsed');
        }

        // ─── Particle background ──────────────────────────────────────
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.8 + 0.4;
                this.speedX = (Math.random() * 0.8) - 0.4;
                this.speedY = (Math.random() * 0.8) - 0.4;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = '#D4AF37';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#D4AF37';
                ctx.fill();
            }
        }

        for (let i = 0; i < 80; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // ─── Load profile ──────────────────────────────────────────────
        async function loadProfile() {
            try {
                // Retry the guard once: storage can be a few milliseconds behind
                // the signInWithPassword() that preceded this navigation.
                let auth = await App.getAuth();
                if (!auth) {
                    await new Promise(r => setTimeout(r, 250));
                    auth = await App.getAuth();
                }
                if (!auth) {
                    console.warn('[profile] still no session after retry -> sign-in page');
                    window.location.href = './pl.html';
                    return;
                }
                // Enforce MFA using Supabase's signed assurance level, not
                // sessionStorage (which a visitor can edit in DevTools).
                let assuranceResult;
                try {
                    assuranceResult = await supabaseClient.auth.mfa.getAuthenticatorAssuranceLevel();
                } catch (mfaError) {
                    console.error('[profile] MFA assurance check failed:', mfaError);
                    window.location.href = './pl.html';
                    return;
                }
                if (!assuranceResult || assuranceResult.error || !assuranceResult.data) {
                    console.error('[profile] MFA assurance could not be verified');
                    window.location.href = './pl.html';
                    return;
                }
                if (assuranceResult.data.nextLevel === 'aal2' &&
                    assuranceResult.data.currentLevel !== 'aal2') {
                    console.warn('[profile] MFA required but session is only AAL1 -> sign-in page');
                    window.location.href = './pl.html';
                    return;
                }
                currentUser = auth.user;

                // Narrow projection, as introduced in PR #1: do not ship every
                // profile column to the browser.
                const { data: profile, error } = await supabaseClient
                    .from('profiles')
                    .select('first_name,last_name,kyc_status,kyc_document_url,member_since')
                    .eq('id', currentUser.id)
                    .maybeSingle();

                if (error) {
                    console.error('Profile fetch error:', error);
                    showToast('Failed to load profile: ' + error.message, true);
                    return;
                }
                if (!profile) {
                    showToast('No profile record found for this account.', true);
                    return;
                }

                currentProfile = profile;
                const firstName = profile?.first_name || '',
                    lastName = profile?.last_name || '',
                    fullName = `${firstName} ${lastName}`.trim() || currentUser.email;
                document.getElementById('user-initials').textContent = (firstName || currentUser.email)[0].toUpperCase();
                document.getElementById('user-fullname').textContent = fullName;
                document.getElementById('user-email-display').textContent = currentUser.email;
                document.getElementById('detail-email').textContent = currentUser.email;
                document.getElementById('detail-name').textContent = fullName;

                const kycStatus = profile.kyc_status || 'unverified';
                const badge = document.getElementById('kyc-status-badge');
                badge.textContent = kycStatus.charAt(0).toUpperCase() + kycStatus.slice(1);
                badge.className = 'value status-' + kycStatus;

                // The stored value is a private-bucket path, not a link.
                const docEl = document.getElementById('detail-kyc-doc');
                if (profile.kyc_document_url) {
                    const url = await App.signedUrl('kyc_documents', profile.kyc_document_url, 900);
                    if (url) {
                        docEl.innerHTML = '<a href="' + App.esc(url) +
                            '" target="_blank" rel="noopener" style="color:var(--brand-yellow)">View ID</a>';
                    } else {
                        docEl.textContent = 'Uploaded';
                    }
                } else {
                    docEl.textContent = 'Not uploaded';
                }

                const uploadSection = document.getElementById('kyc-upload-section'),
                    msg = document.getElementById('kyc-message');
                if (kycStatus === 'unverified' || kycStatus === 'rejected') {
                    uploadSection.style.display = 'block';
                    msg.textContent = kycStatus === 'rejected' ?
                        'Your previous submission was rejected. Please upload a clear ID.' :
                        'Upload a government‑issued ID to verify your account.';
                } else {
                    uploadSection.style.display = 'none';
                    msg.textContent = kycStatus === 'pending' ? 'Your ID is being reviewed.' :
                        'Your identity has been verified.';
                }

                // Load assets
                const assetsBody = document.getElementById('assets-body');
                const { data: assets, error: assetsError } = await supabaseClient
                    .from('user_assets')
                    .select('*')
                    .eq('user_id', currentUser.id);
                if (assetsError) {
                    console.error('Assets fetch error:', assetsError);
                    assetsBody.innerHTML =
                        '<tr><td colspan="3" style="text-align:center;color:var(--trade-red);">Could not load assets.</td></tr>';
                    return;
                }
                if (!assets || assets.length === 0) {
                    assetsBody.innerHTML =
                        '<tr><td colspan="3" style="text-align:center;color:var(--text-muted);">No assets yet.</td></tr>';
                    return;
                }
                // Prices are optional: the table still renders (quantity only)
                // instead of every row showing $0.00.
                const priceMap = await App.getPrices();
                if (!priceMap) {
                    showToast('Live prices unavailable – values may be out of date.', true);
                }
                let html = '';
                assets.forEach(a => {
                    const qty = App.num(a.quantity);
                    const market = priceMap && priceMap[a.asset_symbol];
                    const value = market ? qty * market.usd : null;
                    html +=
                        '<tr><td><strong>' + App.esc(a.asset_symbol) + '</strong></td>' +
                        '<td class="mono">' + qty.toFixed(6).replace(/\.?0+$/, '') + '</td>' +
                        '<td class="mono">' + (value === null ? '—' : App.money(value)) + '</td></tr>';
                });
                assetsBody.innerHTML = html;
            } catch (err) {
                console.error('loadProfile error:', err);
                showToast('Error loading profile: ' + err.message, true);
            }
        }

        // ─── Upload KYC ─────────────────────────────────────────────────
        async function uploadKYC() {
            const fileInput = document.getElementById('kyc-file');
            const file = fileInput.files[0];
            const statusEl = document.getElementById('upload-status');
            const btn = document.getElementById('kyc-upload-btn');
            if (!file) {
                showToast('Please select an image file.', true);
                return;
            }

            // Check file type
            if (!file.type.startsWith('image/')) {
                showToast('Please select an image file (JPEG, PNG, etc.).', true);
                return;
            }

            // Max size 5MB
            if (file.size > 5 * 1024 * 1024) {
                showToast('File size must be under 5MB.', true);
                return;
            }

            const fileName = `${currentUser.id}/${Date.now()}_${file.name.replace(/[^\w.\-]/g, '_')}`;
            statusEl.textContent = 'Uploading...';
            statusEl.style.color = 'var(--brand-yellow)';
            btn.disabled = true; // also stops the double-submit that uploaded twice

            try {
                // 1. Upload to Supabase Storage
                const { error: uploadError } = await supabaseClient.storage
                    .from('kyc_documents')
                    .upload(fileName, file);

                if (uploadError) {
                    console.error('Storage upload error:', uploadError);
                    showToast('Upload failed: ' + uploadError.message, true);
                    statusEl.textContent = 'Upload failed';
                    statusEl.style.color = 'var(--trade-red)';
                    return;
                }

                // 2. Update profile with kyc_status = 'pending' and store file path
                const { error: updateError } = await supabaseClient
                    .from('profiles')
                    .update({
                        kyc_status: 'pending',
                        kyc_document_url: fileName
                    })
                    .eq('id', currentUser.id);

                if (updateError) {
                    console.error('Profile update error:', updateError);
                    showToast('Failed to update profile: ' + updateError.message, true);
                    statusEl.textContent = 'Update failed';
                    statusEl.style.color = 'var(--trade-red)';
                    return;
                }

                // 3. Success
                showToast('ID uploaded for review!');
                statusEl.textContent = '✅ Uploaded successfully';
                statusEl.style.color = 'var(--trade-green)';
                fileInput.value = ''; // Clear the input

                // Reload profile to reflect status
                await loadProfile();
            } catch (err) {
                console.error('Unexpected error during KYC upload:', err);
                showToast('Unexpected error: ' + err.message, true);
                statusEl.textContent = 'Error';
                statusEl.style.color = 'var(--trade-red)';
            } finally {
                btn.disabled = false;
            }
        }

        // ─── Logout ─────────────────────────────────────────────────────
        function logout() {
            supabaseClient.auth.signOut().then(() => window.location.href = './pl.html');
        }

        // ─── Initialise ─────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => { loadProfile(); });
    </script>
