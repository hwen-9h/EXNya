<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>EXNYA | Settings</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Sora:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-base: #080b0f;
            --bg-elevated: #0d1117;
            --brand-yellow: #fcd535;
            --text-primary: #e6e9ef;
            --text-secondary: #5e6a7a;
            --text-muted: #3a4554;
            --border-light: #1e2733;
            --trade-green: #0ecb81;
            --trade-red: #f6465d;
            --sidebar-width: 240px;
            --sidebar-collapsed-width: 64px;
        }

        body.light-theme {
            --bg-base: #f5f7fa;
            --bg-elevated: #ffffff;
            --text-primary: #1a1e25;
            --text-secondary: #5a5f6b;
            --text-muted: #8a8f9a;
            --border-light: #dce0e6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-base);
            color: var(--text-primary);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            transition: background 0.4s, color 0.4s;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.45;
        }

        .app-container {
            position: relative;
            z-index: 1;
            display: flex;
            width: 100%;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-elevated);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease, transform 0.3s ease;
            overflow: hidden;
            white-space: nowrap;
            flex-shrink: 0;
            min-height: 100vh;
        }

        .sidebar.collapsed {
            width: var(--sidebar-collapsed-width);
        }

        .sidebar.collapsed .sidebar-nav a {
            padding: 12px 0;
            justify-content: center;
            gap: 0;
        }

        .sidebar.collapsed .sidebar-nav a .nav-text {
            display: none;
        }

        .sidebar.collapsed .sidebar-nav a .nav-icon {
            margin: 0 auto;
        }

        .sidebar-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 22px 0 18px;
            cursor: pointer;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-light);
            transition: color 0.2s;
        }

        .sidebar-toggle svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .sidebar-toggle:hover {
            color: var(--brand-yellow);
        }

        .sidebar-nav {
            flex: 1;
            padding: 16px 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 10px 14px;
            border-radius: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 500;
            transition: background 0.2s, color 0.2s;
            white-space: nowrap;
        }

        .sidebar-nav a:hover {
            background: rgba(252, 213, 53, 0.08);
            color: var(--brand-yellow);
        }

        .sidebar-nav a.active {
            background: rgba(252, 213, 53, 0.08);
            color: var(--brand-yellow);
        }

        .sidebar-nav a .nav-icon {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .sidebar-nav a .nav-icon svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .sidebar-footer {
            padding: 12px 10px;
            border-top: 1px solid var(--border-light);
        }

        .mobile-toggle {
            display: none;
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 110;
            width: 38px;
            height: 38px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            border-radius: 7px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: color 0.2s, border-color 0.2s;
        }

        .mobile-toggle:hover {
            color: var(--brand-yellow);
            border-color: var(--brand-yellow);
        }

        @media (max-width:768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                z-index: 100;
                box-shadow: 8px 0 32px rgba(0, 0, 0, 0.6);
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar.collapsed {
                width: 240px;
                transform: translateX(-100%);
            }

            .mobile-toggle {
                display: flex;
            }
        }

        .main-content {
            flex: 1;
            padding: 28px 32px;
            max-width: 600px;
        }

        @media (max-width:768px) {
            .main-content {
                padding: 70px 16px 20px;
            }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 32px;
        }

        .top-logo {
            height: 34px;
            width: auto;
        }

        .user-info-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--brand-yellow) 0%, #c9920a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 17px;
            color: #000;
        }

        .user-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .profile-name {
            font-family: 'Sora', sans-serif;
            font-weight: 600;
            font-size: 15px;
        }

        .user-email {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .logout-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            padding: 7px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: border-color 0.2s, color 0.2s;
        }

        .logout-btn svg {
            width: 13px;
            height: 13px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .logout-btn:hover {
            border-color: var(--trade-red);
            color: var(--trade-red);
        }

        .theme-toggle-btn {
            background: transparent;
            border: 1px solid var(--brand-yellow);
            color: var(--brand-yellow);
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .theme-toggle-btn:hover {
            background: var(--brand-yellow);
            color: #12161c;
        }

        .page-title {
            font-family: 'Sora', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .page-sub {
            color: var(--text-secondary);
            margin-bottom: 28px;
        }

        .setting-group {
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            transition: background 0.4s, border-color 0.4s;
        }

        .setting-group h3 {
            margin-top: 0;
            color: var(--brand-yellow);
            font-family: 'Sora', sans-serif;
            font-size: 16px;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: 500;
        }

        select,
        input[type="color"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background: var(--bg-base);
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            transition: background 0.4s, border-color 0.4s, color 0.4s;
        }

        .toggle-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 8px 0;
        }

        .toggle-wrap input[type="checkbox"] {
            width: 44px;
            height: 24px;
            appearance: none;
            background: var(--border-light);
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: 0.3s;
            flex-shrink: 0;
        }

        .toggle-wrap input[type="checkbox"]:checked {
            background: var(--brand-yellow);
        }

        .toggle-wrap input[type="checkbox"]::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            transition: 0.3s;
        }

        .toggle-wrap input[type="checkbox"]:checked::after {
            transform: translateX(20px);
        }

        .btn-save {
            background: var(--brand-yellow);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            transition: opacity 0.2s;
        }

        .btn-save:hover {
            opacity: 0.85;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--bg-elevated);
            border-left: 4px solid var(--trade-green);
            padding: 12px 20px;
            border-radius: 8px;
            z-index: 999;
            display: none;
            transition: background 0.4s;
        }
    </style>
</head>

    <script>
        const SUPABASE_URL = 'https://clwgengvcdokdzubdfxd.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsd2dlbmd2Y2Rva2R6dWJkZnhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MTIxNjEsImV4cCI6MjA5MzQ4ODE2MX0.0zgizWWXLIHiKdNUAJ3yKaIaxEKsHoFeEIo8IUAMtHU';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        window.supabaseClient = supabaseClient;

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (window.innerWidth <= 768) {
                sidebar.classList.toggle('open');
            } else {
                sidebar.classList.toggle('collapsed');
                localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
            }
        }

        if (window.innerWidth > 768 && localStorage.getItem('sidebarCollapsed') === 'true') {
            document.getElementById('sidebar').classList.add('collapsed');
        }

        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let particleColorHex = '#d4af37',
            particleR = 212,
            particleG = 175,
            particleB = 55;

        function updateParticleColor() {
            if (document.body.classList.contains('light-theme')) {
                particleColorHex = '#2a2e35';
                particleR = 42;
                particleG = 46;
                particleB = 53;
            } else {
                particleColorHex = '#d4af37';
                particleR = 212;
                particleG = 175;
                particleB = 55;
            }
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5 + 0.3;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = particleColorHex;
                ctx.fill();
            }
        }

        for (let i = 0; i < 80; i++) particles.push(new Particle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 120) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(${particleR},${particleG},${particleB},${0.12 - distance / 1000})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }

        updateParticleColor();
        animateParticles();

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            const btn = document.getElementById('themeBtn');
            btn.innerHTML = document.body.classList.contains('light-theme') ? '<span>🌙</span> Dark' :
                '<span>☀️</span> Light';
            updateParticleColor();
        }

        async function loadUserInfo() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = './pl.html'; return; }
            const user = session.user;
            document.getElementById('user-initials').textContent = (user.email[0] || 'U').toUpperCase();
            document.getElementById('user-fullname').textContent = user.email.split('@')[0];
            document.getElementById('user-email-display').textContent = user.email;
        }

        async function loadForm() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return;
            const { data: profile } = await supabaseClient
                .from('profiles')
                .select('theme, currency, language, font_size, email_notifications, push_notifications')
                .eq('id', session.user.id)
                .single();

            if (profile) {
                document.getElementById('theme').value = profile.theme || 'dark';
                document.getElementById('fontSize').value = profile.font_size || 14;
                document.getElementById('currency').value = profile.currency || 'USD';
                document.getElementById('language').value = profile.language || 'en';
                document.getElementById('emailNotifications').checked = profile.email_notifications !== false;
                document.getElementById('pushNotifications').checked = profile.push_notifications !== false;

                if (profile.theme === 'light') {
                    document.body.classList.add('light-theme');
                    document.getElementById('themeBtn').innerHTML = '<span>🌙</span> Dark';
                    updateParticleColor();
                }
            }
        }

        async function saveSettings() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { alert('Please log in first.'); return; }

            const settings = {
                theme: document.getElementById('theme').value,
                fontSize: parseInt(document.getElementById('fontSize').value) || 14,
                currency: document.getElementById('currency').value,
                language: document.getElementById('language').value,
                emailNotifications: document.getElementById('emailNotifications').checked,
                pushNotifications: document.getElementById('pushNotifications').checked,
            };

            try {
                const { error } = await supabaseClient
                    .from('profiles')
                    .update({
                        theme: settings.theme,
                        font_size: settings.fontSize,
                        currency: settings.currency,
                        language: settings.language,
                        email_notifications: settings.emailNotifications,
                        push_notifications: settings.pushNotifications,
                    })
                    .eq('id', session.user.id);

                if (error) throw error;

                if (settings.theme === 'light') {
                    document.body.classList.add('light-theme');
                    document.getElementById('themeBtn').innerHTML = '<span>🌙</span> Dark';
                } else {
                    document.body.classList.remove('light-theme');
                    document.getElementById('themeBtn').innerHTML = '<span>☀️</span> Light';
                }
                updateParticleColor();

                const toast = document.getElementById('toast');
                toast.style.display = 'block';
                setTimeout(() => toast.style.display = 'none', 3000);
            } catch (err) {
                alert('Failed to save: ' + err.message);
            }
        }

        function logout() {
            supabaseClient.auth.signOut().then(() => window.location.href = './pl.html');
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadUserInfo();
            loadForm();
        });
    </script>
</body>

</html>
