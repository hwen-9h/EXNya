<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXNYA | Live Portfolio</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Sora:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-base: #080b0f;
            --bg-elevated: #0d1117;
            --brand-yellow: #fcd535;
            --text-primary: #e6e9ef;
            --text-secondary: #5e6a7a;
            --text-muted: #3a4554;
            --border-light: #1e2733;
            --trade-green: #0ecb81;
            --trade-red: #f6465d;
            --sidebar-width: 240px;
            --sidebar-collapsed-width: 64px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-base);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.45;
        }

        .app-container {
            position: relative;
            z-index: 1;
            display: flex;
            width: 100%;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-elevated);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease, transform 0.3s ease;
            overflow: hidden;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .sidebar.collapsed {
            width: var(--sidebar-collapsed-width);
        }

        .sidebar.collapsed .sidebar-nav a {
            padding: 12px 0;
            justify-content: center;
            gap: 0;
        }

        .sidebar.collapsed .sidebar-nav a .nav-text {
            display: none;
        }

        .sidebar.collapsed .sidebar-nav a .nav-icon {
            margin: 0 auto;
        }

        .sidebar-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 22px 0 18px;
            cursor: pointer;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-light);
            transition: color 0.2s;
        }

        .sidebar-toggle svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
        }

        .sidebar-toggle:hover {
            color: var(--brand-yellow);
        }

        .sidebar-nav {
            flex: 1;
            padding: 16px 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 10px 14px;
            border-radius: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 500;
            transition: background 0.2s, color 0.2s;
        }

        .sidebar-nav a:hover {
            background: rgba(252, 213, 53, 0.08);
            color: var(--brand-yellow);
        }

        .sidebar-nav a.active {
            background: rgba(252, 213, 53, 0.08);
            color: var(--brand-yellow);
        }

        .sidebar-nav a .nav-icon {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .sidebar-footer {
            padding: 12px 10px;
            border-top: 1px solid var(--border-light);
        }

        .mobile-toggle {
            display: none;
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 110;
            width: 38px;
            height: 38px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            border-radius: 7px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: color 0.2s, border-color 0.2s;
        }

        .mobile-toggle:hover {
            color: var(--brand-yellow);
            border-color: var(--brand-yellow);
        }

        @media (max-width:768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                z-index: 100;
                box-shadow: 8px 0 32px rgba(0, 0, 0, 0.6);
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar.collapsed {
                width: 240px;
                transform: translateX(-100%);
            }

            .mobile-toggle {
                display: flex;
            }
        }

        .main-content {
            flex: 1;
            padding: 28px 32px;
            overflow-y: auto;
            max-width: 1000px;
        }

        @media (max-width:768px) {
            .main-content {
                padding: 20px 16px;
                margin-top: 50px;
            }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 32px;
        }

        .top-logo {
            height: 34px;
        }

        .user-info-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--brand-yellow), #c9920a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 17px;
            color: #000;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            padding: 7px 16px;
            border-radius: 7px;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
        }

        .logout-btn:hover {
            border-color: var(--trade-red);
            color: var(--trade-red);
        }

        .card {
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 22px 24px;
            margin-bottom: 16px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-light);
        }

        .card-header h2 {
            font-family: 'Sora', sans-serif;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
        }

        .card-header h2 svg {
            width: 15px;
            height: 15px;
            stroke: var(--brand-yellow);
            fill: none;
            stroke-width: 1.8;
        }

        .total-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 32px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .update-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-variant-numeric: tabular-nums;
        }

        thead {
            border-bottom: 1px solid var(--border-light);
        }

        th {
            text-align: left;
            padding: 10px 8px;
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        th:last-child {
            text-align: right;
        }

        tbody td {
            padding: 14px 8px;
            border-bottom: 1px solid var(--border-light);
            font-size: 13.5px;
            color: var(--text-primary);
        }

        tbody td:last-child {
            padding-right: 0;
            text-align: right;
        }

        .asset-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .coin-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--bg-base);
            border: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
            flex-shrink: 0;
        }

        .coin-symbol {
            font-weight: 600;
            font-size: 13.5px;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 500;
        }

        .change-positive {
            color: var(--trade-green);
        }

        .change-negative {
            color: var(--trade-red);
        }

        .loading-text {
            text-align: center;
            color: var(--text-muted);
            padding: 32px 0;
        }
    </style>
</head>

    <script>
        const SUPABASE_URL = 'https://clwgengvcdokdzubdfxd.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsd2dlbmd2Y2Rva2R6dWJkZnhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MTIxNjEsImV4cCI6MjA5MzQ4ODE2MX0.0zgizWWXLIHiKdNUAJ3yKaIaxEKsHoFeEIo8IUAMtHU';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        window.supabaseClient = supabaseClient;

        let currentUser = null,
            priceUpdateInterval = null;

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (window.innerWidth <= 768) {
                sidebar.classList.toggle('open');
            } else {
                sidebar.classList.toggle('collapsed');
                localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
            }
        }

        if (window.innerWidth > 768 && localStorage.getItem('sidebarCollapsed') === 'true') {
            document.getElementById('sidebar').classList.add('collapsed');
        }

        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.8 + 0.4;
                this.speedX = (Math.random() * 0.8) - 0.4;
                this.speedY = (Math.random() * 0.8) - 0.4;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = '#D4AF37';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#D4AF37';
                ctx.fill();
            }
        }

        for (let i = 0; i < 80; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

        async function loadPortfolioData() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = './pl.html'; return; }
            currentUser = session.user;
            document.getElementById('user-initials').textContent = (currentUser.email[0] || 'U').toUpperCase();
            document.getElementById('user-fullname').textContent = currentUser.email;
            document.getElementById('user-email-display').textContent = currentUser.email;
            await updatePortfolio();
            if (priceUpdateInterval) clearInterval(priceUpdateInterval);
            priceUpdateInterval = setInterval(updatePortfolio, 20000);
        }

        async function fetchLivePrices() {
            try {
                const res = await fetch('https://api.coinlore.net/api/tickers/?limit=100');
                if (!res.ok) throw new Error();
                const json = await res.json();
                const priceMap = {};
                json.data.forEach(asset => {
                    priceMap[asset.symbol] = {
                        usd: parseFloat(asset.price_usd),
                        change24h: parseFloat(asset.percent_change_24h)
                    };
                });
                return priceMap;
            } catch (err) { console.error(err); return null; }
        }

        async function updatePortfolio() {
            const tbody = document.getElementById('assets-body');
            tbody.innerHTML = '<tr><td colspan="5" class="loading-text">Updating prices...</td></tr>';
            try {
                const { data: assets, error } = await supabaseClient.from('user_assets').select('*').eq('user_id',
                    currentUser.id);
                if (error || !assets || assets.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="loading-text">No assets found</td></tr>';
                    document.getElementById('total-value').textContent = '$0.00';
                    return;
                }
                const priceMap = await fetchLivePrices();
                if (!priceMap) {
                    tbody.innerHTML =
                        '<tr><td colspan="5" class="loading-text" style="color:var(--trade-red)">Failed to load prices. Retrying soon...</td></tr>';
                    return;
                }
                let totalValue = 0,
                    html = '';
                assets.forEach(asset => {
                    const symbol = asset.asset_symbol,
                        qty = Number(asset.quantity);
                    const market = priceMap[symbol] || { usd: 0, change24h: 0 };
                    const value = qty * market.usd;
                    totalValue += value;
                    const changeClass = market.change24h >= 0 ? 'change-positive' : 'change-negative';
                    const changeSign = market.change24h >= 0 ? '+' : '';
                    const coinColor = getCoinColor(symbol);
                    html +=
                        `<tr><td><div class="asset-cell"><div class="coin-icon" style="background:${coinColor};color:white;">${symbol[0]}</div><span class="coin-symbol">${symbol}</span></div></td><td class="mono">${qty.toFixed(4)}</td><td class="mono">$${market.usd.toFixed(2)}</td><td class="mono ${changeClass}">${changeSign}${market.change24h.toFixed(2)}%</td><td class="mono">$${value.toFixed(2)}</td></tr>`;
                });
                tbody.innerHTML = html;
                document.getElementById('total-value').textContent = `$${totalValue.toFixed(2)}`;
                document.getElementById('update-time').textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
            } catch (err) {
                console.error(err);
                tbody.innerHTML = '<tr><td colspan="5" class="loading-text" style="color:var(--trade-red)">Failed to load portfolio.</td></tr>';
            }
        }

        function getCoinColor(symbol) {
            const colors = {
                BTC: '#F7931A', ETH: '#627EEA', SOL: '#14F195', USDT: '#26A17B', ADA: '#0033AD',
                USDC: '#2775CA', XRP: '#0085FF', DOGE: '#C2A633', DOT: '#E6007A'
            };
            return colors[symbol] || '#444';
        }

        function logout() {
            supabaseClient.auth.signOut().then(() => window.location.href = './pl.html');
        }

        loadPortfolioData();
    </script>
    <script src="settings.js"></script>
</body>

</html>
