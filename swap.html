        :root {
            --bg-base: #080b0f;
            --bg-elevated: #0d1117;
            --brand-yellow: #fcd535;

            --text-secondary: #5e6a7a;

            --border-light: #1e2733;
            --trade-green: #0ecb81;
            --trade-red: #f6465d;
            --sidebar-width: 240px;
            --sidebar-collapsed-width: 64px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-base);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.45;
        }

        .app-container {
            position: relative;
            z-index: 1;
            display: flex;
            width: 100%;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-elevated);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease, transform 0.3s ease;
            overflow: hidden;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .sidebar.collapsed {
            width: var(--sidebar-collapsed-width);
        }

        .sidebar.collapsed .sidebar-nav a {
            padding: 12px 0;
            justify-content: center;
            gap: 0;
        }

        .sidebar.collapsed .sidebar-nav a .nav-text {
            display: none;
        }

        .sidebar.collapsed .sidebar-nav a .nav-icon {
            margin: 0 auto;
        }

        .sidebar-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 22px 0 18px;
            cursor: pointer;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-light);
            transition: color 0.2s;
        }

        .sidebar-toggle svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;

        }

    <script>
        const SUPABASE_URL = 'https://clwgengvcdokdzubdfxd.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsd2dlbmd2Y2Rva2R6dWJkZnhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MTIxNjEsImV4cCI6MjA5MzQ4ODE2MX0.0zgizWWXLIHiKdNUAJ3yKaIaxEKsHoFeEIo8IUAMtHU';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        window.supabaseClient = supabaseClient;
        // Browser-provided prices are display-only, never trusted for balance changes.
        const SWAPS_ENABLED = false;

        let currentUser = null,
            userAssetsMap = {},
            livePrices = {},
            availableCoins = [],
            selectedFrom = null,
            selectedTo = null,
            swapInProgress = false;

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (window.innerWidth <= 768) {
                sidebar.classList.toggle('open');
            } else {
                sidebar.classList.toggle('collapsed');
                localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
            }
        }

        if (window.innerWidth > 768 && localStorage.getItem('sidebarCollapsed') === 'true') {
            document.getElementById('sidebar').classList.add('collapsed');
        }

        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.8 + 0.4;
                this.speedX = (Math.random() * 0.8) - 0.4;
                this.speedY = (Math.random() * 0.8) - 0.4;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = '#D4AF37';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#D4AF37';
                ctx.fill();
            }
        }

        for (let i = 0; i < 80; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

        async function initSwap() {
            const auth = await App.requireVerifiedSession();
            if (!auth) return;
            currentUser = auth.user;
            document.getElementById('user-initials').textContent = (currentUser.email[0] || 'U').toUpperCase();
            document.getElementById('user-fullname').textContent = currentUser.email;
            document.getElementById('user-email-display').textContent = currentUser.email;
            await loadUserAssets();
            await loadPricesAndCoins();
            const symbols = Object.keys(userAssetsMap);
            if (symbols.length > 0) {
                selectedFrom = symbols[0];
                document.getElementById('from-symbol').textContent = selectedFrom;
                document.getElementById('from-logo').innerHTML = getCoinLogoHTML(selectedFrom);
                const other = availableCoins.find(c => c.symbol !== selectedFrom);
                if (other) {
                    selectedTo = other.symbol;
                    document.getElementById('to-symbol').textContent = selectedTo;
                    document.getElementById('to-logo').innerHTML = getCoinLogoHTML(selectedTo);
                }
            }
            updateQuote();
        }

        async function loadUserAssets() {
            const { data: assets, error } = await supabaseClient.from('user_assets')
                .select('id, asset_symbol, quantity')
                .eq('user_id', currentUser.id);
            if (error) console.error('loadUserAssets failed:', error);
            userAssetsMap = {};
            if (assets) assets.forEach(a => {
                userAssetsMap[a.asset_symbol] = {
                    id: a.id, quantity: Number(a
                        .quantity)
                };
            });
        }

        const FALLBACK_COINS = ['USDC', 'USDT', 'ETH', 'SOL', 'SUI', 'APT', 'DAI', 'WBTC'];

        async function loadPricesAndCoins() {
            // Shared cached fetch (one request per 30s, instead of one per page
            // load that the old api.coinlore.net CORS setting could break).
            const prices = await App.getPrices();
            if (prices) {
                livePrices = {};
                Object.keys(prices).forEach(sym => { livePrices[sym] = prices[sym].usd; });
                availableCoins = Object.keys(prices).slice(0, 30).map(sym => ({ symbol: sym, price: prices[sym].usd }));
            } else {
                // Keep the picker usable: fall back to the assets we already show
                // elsewhere and let updateQuote() flag missing rates.
                availableCoins = FALLBACK_COINS.map(sym => ({ symbol: sym, price: livePrices[sym] || 0 }));
            }
        }

        function getCoinLogoHTML(symbol) {
            const colors = {
                BTC: '#F7931A', ETH: '#627EEA', USDT: '#26A17B', USDC: '#2775CA', SOL: '#14F195', ADA: '#0033AD',
                XRP: '#0085FF', DOGE: '#C2A633', DOT: '#E6007A'
            };
            const sym = App.esc(symbol || '?');
            return `<div style="width:22px;height:22px;border-radius:50%;background:${colors[symbol] || '#444'};display:flex;align-items:center;justify-content:center;color:white;font-size:10px;font-weight:600;">${sym[0] || '?'}</div>`;
        }

        function updateQuote() {
            if (!selectedFrom || !selectedTo || !livePrices[selectedFrom] || !livePrices[selectedTo]) {
                document.getElementById('swap-button').disabled = true;
                document.getElementById('swap-button').textContent = 'Select assets';
                return;
            }
            const fromAmount = parseFloat(document.getElementById('from-amount').value) || 0;
            if (fromAmount <= 0) {
                document.getElementById('swap-button').disabled = true;
                document.getElementById('swap-button').textContent = 'Enter an amount';
                document.getElementById('to-amount').value = '';
                document.getElementById('detail-rate').textContent = '--';
                document.getElementById('detail-fee').textContent = '--';
                document.getElementById('detail-receive').textContent = '--';
                return;
            }
            const rate = livePrices[selectedFrom] / livePrices[selectedTo];
            if (!isFinite(rate) || rate <= 0) {
                document.getElementById('swap-button').disabled = true;
                document.getElementById('swap-button').textContent = 'Rate unavailable';
                return;
            }
            const fee = fromAmount * 0.005;
            const receive = (fromAmount - fee) * rate;
            document.getElementById('to-amount').value = receive.toFixed(6);
            document.getElementById('detail-rate').textContent = `1 ${selectedFrom} = ${rate.toFixed(6)} ${selectedTo}`;
            document.getElementById('detail-fee').textContent = `${fee.toFixed(6)} ${selectedFrom}`;
            document.getElementById('detail-receive').textContent = `${receive.toFixed(6)} ${selectedTo}`;
            document.getElementById('swap-button').disabled = !SWAPS_ENABLED;
            document.getElementById('swap-button').textContent = SWAPS_ENABLED ? 'Swap' : 'Swaps temporarily paused';
        }

        // Flip the pair. The guard on userAssetsMap[selectedFrom] used to make
        // this a silent no-op whenever the "to" asset was not held (the common
        // case), so the flip button looked broken.
        function swapAssets() {
            if (!selectedFrom || !selectedTo) return;
            if (selectedFrom === selectedTo) return;
            [selectedFrom, selectedTo] = [selectedTo, selectedFrom];
            document.getElementById('from-symbol').textContent = selectedFrom;
            document.getElementById('from-logo').innerHTML = getCoinLogoHTML(selectedFrom);
            document.getElementById('to-symbol').textContent = selectedTo;
            document.getElementById('to-logo').innerHTML = getCoinLogoHTML(selectedTo);
            document.getElementById('from-amount').value = '';
            document.getElementById('to-amount').value = '';
            updateQuote();
        }

        function openAssetPicker(side) {
            const list = document.getElementById('picker-list');
            list.innerHTML = '';
            if (side === 'from') {
                const symbols = Object.keys(userAssetsMap);
                if (symbols.length === 0) list.innerHTML =
                    '<p style="color:var(--text-muted)">No assets in your wallet.</p>';
                else symbols.forEach(sym => {
                    const btn = document.createElement('button');
                    btn.className = 'btn btn-outline';
                    btn.style.justifyContent = 'flex-start';
                    btn.innerHTML = `${getCoinLogoHTML(sym)} ${App.esc(sym)}`;
                    btn.onclick = () => selectAsset(side, sym);
                    list.appendChild(btn);
                });
            } else {
                loadPricesAndCoins().then(() => {
                    list.innerHTML = '';
                    if (availableCoins.length === 0) list.innerHTML =
                        '<p style="color:var(--text-muted)">Could not load coins.</p>';
                    else availableCoins.forEach(coin => {
                        const btn = document.createElement('button');
                        btn.className = 'btn btn-outline';
                        btn.style.justifyContent = 'flex-start';
                        btn.innerHTML = `${getCoinLogoHTML(coin.symbol)} ${App.esc(coin.symbol)}`;
                        btn.onclick = () => selectAsset(side, coin.symbol);
                        list.appendChild(btn);
                    });
                });
            }
            document.getElementById('picker-modal').style.display = 'flex';
        }

        function selectAsset(side, symbol) {
            if (side === 'from') {
                selectedFrom = symbol;
                document.getElementById('from-symbol').textContent = symbol;
                document.getElementById('from-logo').innerHTML = getCoinLogoHTML(symbol);
            } else {
                selectedTo = symbol;
                document.getElementById('to-symbol').textContent = symbol;
                document.getElementById('to-logo').innerHTML = getCoinLogoHTML(symbol);
            }
            document.getElementById('from-amount').value = '';
            document.getElementById('to-amount').value = '';
            closePicker();
            updateQuote();
        }

        function closePicker() { document.getElementById('picker-modal').style.display = 'none'; }

        // Smallest unit we keep, so repeated swaps cannot leave dust like 1e-17.
        const QTY_DECIMALS = 8;
        function roundQty(n) {
            const f = Math.pow(10, QTY_DECIMALS);
            return Math.round(App.num(n) * f) / f;
        }

        async function executeSwap() {
            if (!SWAPS_ENABLED) {
                alert('Swaps are temporarily disabled until secure server-side pricing is available. Your balance has not changed.');
                return;
            }
            if (swapInProgress) return;
            const fromAmount = parseFloat(document.getElementById('from-amount').value);
            if (!fromAmount || fromAmount <= 0 || !selectedFrom || !selectedTo) return;
            if (selectedFrom === selectedTo) { alert('Choose two different assets.'); return; }
            const fromAsset = userAssetsMap[selectedFrom];
            if (!fromAsset || fromAsset.quantity < fromAmount) { alert('Insufficient balance.'); return; }
            const toAmount = parseFloat(document.getElementById('to-amount').value);
            if (!isFinite(toAmount) || toAmount <= 0) { alert('No valid quote for this pair.'); return; }

            // Capture the pair now: the confirm handler used to read the live
            // selectedFrom/selectedTo globals, so changing the selection while
            // the modal was open swapped a different pair than the one quoted.
            const fromSymbol = selectedFrom;
            const toSymbol = selectedTo;
            document.getElementById('confirm-text').textContent =
                `Swap ${fromAmount} ${fromSymbol} → ${toAmount.toFixed(6)} ${toSymbol}?`;

            document.getElementById('confirm-yes').onclick = async () => {
                closeConfirm();
                if (swapInProgress) return;
                swapInProgress = true;
                const btn = document.getElementById('swap-button');
                btn.disabled = true;
                btn.innerHTML = '<div class="spinner"></div> Swapping…';
                try {
                    // The SERVER performs the money move: it re-prices the pair,
                    // rejects a quote more than 1% away from its own price, then
                    // debits and credits atomically in one transaction. A tampered
                    // page can no longer write its own quantity.
                    const prices = {};
                    Object.keys(livePrices).forEach(sym => {
                        const v = Number(livePrices[sym]);
                        if (isFinite(v) && v > 0) prices[sym] = v;
                    });
                    const { data, error } = await supabaseClient.rpc('swap_execute', {
                        p_from_asset: fromSymbol,
                        p_from_amount: fromAmount,
                        p_to_asset: toSymbol,
                        p_to_amount: toAmount,
                        p_prices: prices
                    });
                    if (error) throw new Error(error.message || 'Swap failed');
                    if (!data || data.ok !== true) throw new Error('The server did not confirm the swap.');

                    const credited = Number(data.to_amount);
                    // Show the server's figure, then reload the real balances.
                    if (roundQty(fromAsset.quantity - fromAmount) <= 0) delete userAssetsMap[fromSymbol];
                    else userAssetsMap[fromSymbol].quantity = roundQty(fromAsset.quantity - fromAmount);
                    if (userAssetsMap[toSymbol]) userAssetsMap[toSymbol].quantity = roundQty(userAssetsMap[toSymbol].quantity + credited);
                    else userAssetsMap[toSymbol] = { id: null, quantity: credited };

                    document.getElementById('from-amount').value = '';
                    document.getElementById('to-amount').value = '';
                    updateQuote();
                    alert('Swap successful! Received ' + credited.toFixed(6) + ' ' + toSymbol);
                } catch (err) {
                    alert('Swap failed: ' + (err.message || 'please try again'));
                } finally {
                    swapInProgress = false;
                    await loadUserAssets();
                    updateQuote();
                    btn.disabled = false;
                    btn.textContent = 'Swap';
                }
            };
            document.getElementById('confirm-modal').style.display = 'flex';
        }

        function closeConfirm() { document.getElementById('confirm-modal').style.display = 'none'; }

        // Both modals could only be dismissed from their own buttons; a click on
        // the dark backdrop did nothing.
        [['confirm-modal', closeConfirm], ['picker-modal', closePicker]].forEach(([id, close]) => {
            const el = document.getElementById(id);
            if (el) el.addEventListener('click', (e) => { if (e.target === el) close(); });
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { closeConfirm(); closePicker(); }
        });

        function logout() {
            supabaseClient.auth.signOut().then(() => window.location.href = './pl.html');
        }

        document.addEventListener('DOMContentLoaded', () => { initSwap(); });
    </script>
</body>

</html>
