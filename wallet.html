<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXNYA | Wallet</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Sora:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-base: #080b0f;
            --bg-elevated: #0d1117;
            --brand-yellow: #fcd535;
            --text-primary: #e6e9ef;
            --text-secondary: #5e6a7a;
            --text-muted: #3a4554;
            --border-light: #1e2733;
            --trade-red: #f6465d;
            --sidebar-width: 240px;
            --sidebar-collapsed-width: 64px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-base);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.45;
        }

        .app-container {
            position: relative;
            z-index: 1;
            display: flex;
            width: 100%;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-elevated);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease, transform 0.3s ease;
            overflow: hidden;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .sidebar.collapsed {
            width: var(--sidebar-collapsed-width);
        }

        .sidebar.collapsed .sidebar-nav a {
            padding: 12px 0;
            justify-content: center;
            gap: 0;
        }

        .sidebar.collapsed .sidebar-nav a .nav-text {
            display: none;
        }

        .sidebar.collapsed .sidebar-nav a .nav-icon {
            margin: 0 auto;
        }

        .sidebar-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 22px 0 18px;
            cursor: pointer;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-light);
            transition: color 0.2s;
        }

        .sidebar-toggle svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
        }

        .sidebar-toggle:hover {
            color: var(--brand-yellow);
        }

        .sidebar-nav {
            flex: 1;
            padding: 16px 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 10px 14px;
            border-radius: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 500;
            transition: background 0.2s, color 0.2s;
        }

        .sidebar-nav a:hover {
            background: rgba(252, 213, 53, 0.08);
            color: var(--brand-yellow);
        }

        .sidebar-nav a.active {
            background: rgba(252, 213, 53, 0.08);
            color: var(--brand-yellow);
        }

        .sidebar-nav a .nav-icon {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .sidebar-footer {
            padding: 12px 10px;
            border-top: 1px solid var(--border-light);
        }

        .mobile-toggle {
            display: none;
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 110;
            width: 38px;
            height: 38px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            border-radius: 7px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: color 0.2s, border-color 0.2s;
        }

        .mobile-toggle:hover {
            color: var(--brand-yellow);
            border-color: var(--brand-yellow);
        }

        @media (max-width:768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                z-index: 100;
                box-shadow: 8px 0 32px rgba(0, 0, 0, 0.6);
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar.collapsed {
                width: 240px;
                transform: translateX(-100%);
            }

            .mobile-toggle {
                display: flex;
            }
        }

        .main-content {
            flex: 1;
            padding: 28px 32px;
            overflow-y: auto;
            max-width: 1000px;
        }

        @media (max-width:768px) {
            .main-content {
                padding: 20px 16px;
                margin-top: 50px;
            }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 32px;
        }

        .top-logo {
            height: 34px;
        }

        .user-info-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--brand-yellow), #c9920a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 17px;
            color: #000;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            padding: 7px 16px;
            border-radius: 7px;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
        }

        .logout-btn:hover {
            border-color: var(--trade-red);
            color: var(--trade-red);
        }

        .card {
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .total-balance {
            font-family: 'Sora', sans-serif;
            font-size: 36px;
            font-weight: 700;
            color: var(--brand-yellow);
            margin-bottom: 8px;
        }

        .asset-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 16px;
        }

        .asset-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg-base);
            border-radius: 12px;
            border: 1px solid var(--border-light);
            transition: all 0.2s;
            flex-wrap: wrap;
            gap: 8px;
        }

        .asset-item:hover {
            border-color: var(--brand-yellow);
            background: var(--bg-hover);
        }

        .asset-name {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .asset-balance {
            font-family: 'JetBrains Mono', monospace;
            color: var(--brand-yellow);
        }

        .btn {
            padding: 6px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-size: 12px;
        }

        .btn-primary {
            background: var(--brand-yellow);
            color: #000;
        }

        .btn-primary:hover {
            background: #e6c030;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
        }

        .btn-secondary:hover {
            border-color: var(--brand-yellow);
            color: var(--text-primary);
        }

        .btn-danger {
            background: rgba(246, 70, 93, 0.15);
            color: var(--trade-red);
            border: 1px solid rgba(246, 70, 93, 0.2);
        }

        .btn-danger:hover {
            background: rgba(246, 70, 93, 0.25);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal {
            background: var(--bg-elevated);
            border-radius: 20px;
            padding: 28px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .address-box {
            background: var(--bg-base);
            padding: 12px;
            border-radius: 12px;
            word-break: break-all;
            margin: 16px 0;
        }

        .add-asset-btn {
            margin-top: 16px;
        }

        .asset-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .empty-state {
            text-align: center;
            padding: 32px;
            color: var(--text-muted);
        }
    </style>
</head>

    <script>
        const SUPABASE_URL = 'https://clwgengvcdokdzubdfxd.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsd2dlbmd2Y2Rva2R6dWJkZnhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MTIxNjEsImV4cCI6MjA5MzQ4ODE2MX0.0zgizWWXLIHiKdNUAJ3yKaIaxEKsHoFeEIo8IUAMtHU';
        const DEFAULT_CHAIN = 'base-sepolia';
        let supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        window.supabaseClient = supabaseClient;
        let currentUser = null;
        let assetData = {};

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (window.innerWidth <= 768) {
                sidebar.classList.toggle('open');
            } else {
                sidebar.classList.toggle('collapsed');
                localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
            }
        }

        if (window.innerWidth > 768 && localStorage.getItem('sidebarCollapsed') === 'true') {
            document.getElementById('sidebar').classList.add('collapsed');
        }

        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5 + 0.3;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = '#D4AF37';
                ctx.fill();
            }
        }

        for (let i = 0; i < 60; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

        async function init() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = './pl.html'; return; }
            currentUser = session.user;
            document.getElementById('user-initials').textContent = (currentUser.email[0] || 'U').toUpperCase();
            document.getElementById('user-fullname').textContent = currentUser.email.split('@')[0];
            document.getElementById('user-email-display').textContent = currentUser.email;
            await loadAssets();
        }

        async function getFreshToken() {
            const { data: { session }, error } = await supabaseClient.auth.refreshSession();
            if (error || !session) {
                const { data: { session: newSession }, error: newError } = await supabaseClient.auth.getSession();
                if (newError || !newSession) {
                    window.location.href = './pl.html';
                    throw new Error('No valid session');
                }
                return newSession.access_token;
            }
            return session.access_token;
        }

        async function loadAssets() {
            const list = document.getElementById('asset-list');
            list.innerHTML = '<p style="color:var(--text-muted)">Loading assets...</p>';

            try {
                const token = await getFreshToken();
                const response = await fetch(`${SUPABASE_URL}/functions/v1/wallet-operations`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ action: 'listBalances' })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Failed to load balances');

                const balances = data.balances || [];
                assetData = {};
                let total = 0;

                const positiveItems = balances.filter(item => item.balance > 0);
                positiveItems.forEach(item => {
                    const key = `${item.asset}-${item.chain}`;
                    assetData[key] = {
                        address: item.address,
                        balance: item.balance,
                        chain: item.chain
                    };
                    total += item.balance;
                });

                if (positiveItems.length === 0) {
                    list.innerHTML =
                        `<div class="empty-state">No assets with balance.<br>Click "Add Asset" to deposit.</div>`;
                    document.getElementById('total-balance').textContent = '$0.00';
                    return;
                }

                let html = '';
                positiveItems.forEach(item => {
                    html += `
                        <div class="asset-item">
                            <span class="asset-name">
                                <span style="font-size:18px;">${item.asset}</span>
                                <span style="font-size:11px; color:var(--text-muted);">(${item.chain})</span>
                            </span>
                            <span class="asset-balance">$${item.balance.toFixed(2)}</span>
                            <span class="asset-actions">
                                <button class="btn btn-primary" onclick="showDepositAddress('${item.asset}', '${item.chain}')">Deposit</button>
                                <button class="btn btn-danger" onclick="removeAsset('${item.asset}', '${item.chain}')">Remove</button>
                            </span>
                        </div>
                    `;
                });
                list.innerHTML = html;
                document.getElementById('total-balance').textContent = `$${total.toFixed(2)}`;
            } catch (err) {
                console.error(err);
                list.innerHTML = `<p style="color:var(--trade-red)">Error: ${err.message}</p>`;
            }
        }

        async function addAsset() {
            const asset = prompt('Enter asset symbol (e.g., USDC, ETH, USDT):');
            if (!asset) return;
            const symbol = asset.toUpperCase();

            const chainInput = prompt(`Enter chain (default: ${DEFAULT_CHAIN}):`, DEFAULT_CHAIN);
            const chain = chainInput || DEFAULT_CHAIN;

            try {
                const token = await getFreshToken();
                const response = await fetch(`${SUPABASE_URL}/functions/v1/wallet-operations`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        action: 'getOrCreate',
                        asset: symbol,
                        chain: chain
                    })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Failed to create address');

                document.getElementById('deposit-modal-title').textContent = `Deposit ${symbol}`;
                document.getElementById('deposit-asset').textContent = symbol;
                document.getElementById('deposit-chain').textContent = chain;
                document.getElementById('deposit-address').textContent = data.address;
                document.getElementById('deposit-modal').style.display = 'flex';

                await loadAssets();
            } catch (err) {
                console.error(err);
                alert('Error: ' + err.message);
            }
        }

        async function removeAsset(assetSymbol, chain) {
            if (!confirm(`Remove ${assetSymbol} on ${chain} from your wallet?`)) return;
            try {
                const token = await getFreshToken();
                const response = await fetch(`${SUPABASE_URL}/functions/v1/wallet-operations`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        action: 'deleteWallet',
                        asset: assetSymbol,
                        chain: chain
                    })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Failed to remove asset');
                await loadAssets();
                alert(`${assetSymbol} on ${chain} removed.`);
            } catch (err) {
                console.error(err);
                alert('Error: ' + err.message);
            }
        }

        function showDepositAddress(asset, chain) {
            const key = `${asset}-${chain}`;
            const info = assetData[key];
            if (!info || !info.address) {
                alert('No address found. Please add this asset first.');
                return;
            }
            document.getElementById('deposit-modal-title').textContent = `Deposit ${asset}`;
            document.getElementById('deposit-asset').textContent = asset;
            document.getElementById('deposit-chain').textContent = chain;
            document.getElementById('deposit-address').textContent = info.address;
            document.getElementById('deposit-modal').style.display = 'flex';
        }

        function copyAddress() {
            const address = document.getElementById('deposit-address').textContent;
            navigator.clipboard.writeText(address);
            alert('Address copied!');
        }

        function closeDeposit() {
            document.getElementById('deposit-modal').style.display = 'none';
        }

        function logout() {
            supabaseClient.auth.signOut().then(() => window.location.href = './pl.html');
        }

        init();
    </script>
    <script src="settings.js"></script>
</body>

</html>
