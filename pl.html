        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Sora:wght@400;600;700&display=swap"
        rel="stylesheet">

    <!-- 2FA uses an authenticator app (TOTP) via Supabase Auth MFA. No email and no Edge Function involved. -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #080b0f;
            color: #e6e9ef;
            font-family: 'DM Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .login-box {
            background: #0d1117;
            border: 1px solid #1e2733;
            border-radius: 16px;
            padding: 32px 24px;
            width: 100%;
            max-width: 400px;
        }

        .logo {
            display: block;
            margin: 0 auto 24px;
            height: 36px;
        }

        h2 {
            font-family: 'Sora', sans-serif;
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #5e6a7a;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            background: #080b0f;
            border: 1px solid #1e2733;
            border-radius: 8px;
            color: #e6e9ef;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #fcd535;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: #fcd535;
            color: #000;
        }

        .btn-primary:hover {
            background: #e6c030;
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-msg {
            color: #f97387;
            font-size: 12px;
            margin-top: 6px;
        }

        .hidden {
            display: none;
        }

        .otp-note {
            color: #5e6a7a;
            font-size: 12px;
            text-align: center;
            margin: 12px 0;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (min-width: 480px) {
            .login-box {
                padding: 40px 36px;
            }

            .logo {
                height: 42px;
            }

            h2 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <div class="login-box"><img class="logo" src="WhatsApp Image 2026-04-03 at 4.24.59 AM.jpeg" alt="EXNYA">
        <h2>Sign In to EXNYA</h2>
        <div id="step-password">
            <div class="form-group"><label>Email</label><input type="email" id="email" placeholder="you@example.com">
            </div>
            <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="••••••••">
            </div><button class="btn btn-primary" id="login-btn" onclick="handleLogin()">Sign In</button>
            <p class="error-msg" id="login-error"></p>
        </div>
        <div id="step-otp" class="hidden">
            <p class="otp-note" id="otp-note">Open your authenticator app and enter the 6&#8209;digit code for <strong id="otp-email"></strong>.</p>
            <div class="form-group"><label>Authenticator Code</label><input type="text" id="otp-input"
                    placeholder="000 000" maxlength="6" inputmode="numeric"></div><button class="btn btn-primary"
                id="verify-btn" onclick="handleVerifyOTP()">Verify</button>
            <p class="error-msg" id="otp-error"></p><button class="btn"
                style="background:transparent;color:#5e6a7a;margin-top:12px;" onclick="goBackToPassword()">←
                Back</button>
        </div>
        <div style="margin-top:18px;font-size:13px;color:#5e6a7a;">No account yet?
            <a href="./signup.html" style="color:#fcd535;text-decoration:none;">Create one</a>
        </div>
    </div>
    
<script>
const SUPABASE_URL = 'https://clwgengvcdokdzubdfxd.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsd2dlbmd2Y2Rva2R6dWJkZnhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MTIxNjEsImV4cCI6MjA5MzQ4ODE2MX0.0zgizWWXLIHiKdNUAJ3yKaIaxEKsHoFeEIo8IUAMtHU';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null;

// 2FA gate. Every dashboard page treats "signed in" as good enough, so an
// account with 2FA on could dodge the code by opening ./profile.html directly
// (and by simply reloading, since nothing recorded that this session passed).
// Pages call App.isOtpVerified() and bounce back here when it returns false.
const OTP_KEY = 'exnya_otp_verified';

function markOtpVerified(userId) {
    try { sessionStorage.setItem(OTP_KEY, userId || 'verified'); } catch (e) { /* private mode */ }
}

async function clearOtpVerified() {
    try { sessionStorage.removeItem(OTP_KEY); } catch (e) { /* ignore */ }
    // A previous session's proof must not unlock this one.
    await supabaseClient.auth.signOut();
}

// Remember on this (2FA) page that the code was already entered, so resuming a
// session here lands on the dashboard instead of immediately resending a code.
function markOtpPendingFor(userId) {
    try { sessionStorage.setItem('exnya_otp_pending', userId || ''); } catch (e) { /* ignore */ }
}
function otpPendingFor(userId) {
    try { return (sessionStorage.getItem('exnya_otp_pending') || '') === (userId || ''); } catch (e) { return false; }
}

function showError(id, message) { document.getElementById(id).textContent = message || ''; }
function setBusy(button, busy, label) { button.disabled = busy; button.textContent = label; }

// ── Authenticator-app (TOTP) second step ────────────────────────────────
// No email is involved: Supabase stores the factor, the phone stores the
// secret, and the code is checked server-side by challengeAndVerify.
let totpFactorId = null;

/** Enrolled authenticator factors for the signed-in user (token direct). */
async function listTotpFactors() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) return [];
    try {
        const res = await fetch(SUPABASE_URL + '/auth/v1/factors', {
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + session.access_token }
        });
        if (!res.ok) return [];
        const json = await res.json();
        return [...(json.all || []), ...(json.totp || [])].filter(f => f && f.factor_type === 'totp');
    } catch (e) {
        console.warn('[login] factor list failed:', e.message);
        return [];
    }
}

/** Inline guidance on the OTP step (no email is sent any more). */
function setStepMessage(email) {
    document.getElementById('step-password').classList.add('hidden');
    document.getElementById('step-otp').classList.remove('hidden');
    const note = document.getElementById('otp-note');
    if (note) note.innerHTML = 'Open your authenticator app and enter the 6&#8209;digit code for <strong>' +
        (email || '') + '</strong>.';
    const input = document.getElementById('otp-input');
    if (input) { input.value = ''; input.focus(); }
    const resend = document.getElementById('resend-btn');
    if (resend) resend.style.display = 'none';   // nothing to resend
}

async function handleLogin() {
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const button = document.getElementById('login-btn');
    showError('login-error', '');
    showError('otp-error', '');
    if (!email || !password) { showError('login-error', 'Please enter both email and password.'); return; }
    setBusy(button, true, 'Signing in…');
    try {
        await clearOtpVerified();
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) { showError('login-error', error.message); return; }
        currentUser = data.user;

        // The enrolled factor is the source of truth (the profiles flag can be
        // stale). Load the factors from the fresh session directly.
        const { data: profile } = await supabaseClient.from('profiles')
            .select('is_2fa_enabled').eq('id', currentUser.id).maybeSingle();
        const factors = await listTotpFactors();
        if (!factors.length) {
            // No authenticator enrolled: normal sign-in.
            window.location.href = './profile.html';
            return;
        }
        totpFactorId = factors[0].id;
        if (profile && !profile.is_2fa_enabled) {
            // Heal a stale flag left behind by the old email-2FA code.
            supabaseClient.from('profiles').update({ is_2fa_enabled: true }).eq('id', currentUser.id).then(() => { }, () => { });
        }
        markOtpPendingFor(currentUser.id);
        setStepMessage(email);
    } catch (error) {
        showError('login-error', error.message || 'Sign-in failed. Please try again.');
    } finally {
        setBusy(button, false, 'Sign In');
    }
}

async function handleVerifyOTP() {
    const code = document.getElementById('otp-input').value.replace(/\D/g, '');
    const button = document.getElementById('verify-btn');
    showError('otp-error', '');
    if (code.length !== 6) { showError('otp-error', 'Enter the 6-digit code from your app.'); return; }
    if (!totpFactorId) { showError('otp-error', 'Sign in again to start verification.'); return; }
    setBusy(button, true, 'Verifying…');
    try {
        const { error } = await supabaseClient.auth.mfa.challengeAndVerify({
            factorId: totpFactorId,
            code: code
        });
        if (error) {
            showError('otp-error', error.message || 'Invalid or expired code.');
            return;
        }
        document.getElementById('otp-input').value = '';
        markOtpVerified(currentUser ? currentUser.id : 'verified');
        window.location.href = './profile.html';
    } catch (error) {
        showError('otp-error', error.message || 'Verification failed. Please try again.');
    } finally {
        setBusy(button, false, 'Verify');
    }
}

async function goBackToPassword() {
    document.getElementById('step-otp').classList.add('hidden');
    document.getElementById('step-password').classList.remove('hidden');
    showError('otp-error', '');
    // Going back means abandoning this attempt: sign out so the half-finished
    // session cannot be used to open the dashboard.
    await clearOtpVerified();
    currentUser = null;
    totpFactorId = null;
}

// Link back to signup: the page had no way out to account creation.
function goToSignup() { window.location.href = './signup.html'; }


(async function resumeSession() {
    try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) return;
        // The enrolled authenticator decides whether a second step is needed.
        const factors = await listTotpFactors();
        if (!factors.length) { window.location.href = './profile.html'; return; }
        currentUser = session.user;
        totpFactorId = factors[0].id;
        markOtpPendingFor(session.user.id);
        setStepMessage(session.user.email);
    } catch (error) {
        showError('login-error', error.message || 'Could not resume your session.');
    }
})();
</script>
    <script>
        // Defence in depth: framebust + block tab-nabbing on any outbound link.
        (function () {
            try { if (window.top !== window.self) window.top.location = window.self.location.href; } catch (e) { }
            document.addEventListener("click", function (ev) {
                var a = ev.target && ev.target.closest ? ev.target.closest("a[target=_blank]") : null;
                if (a) a.rel = "noopener noreferrer";
            }, true);
        })();
    </script>
</body>

</html>
