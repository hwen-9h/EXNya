<head>

    <style>
        /* ── hide ALL browser scrollbars ── */
        * {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        *::-webkit-scrollbar {
            display: none;
        }

        html {
            scroll-behavior: smooth;
        }

        :root {
            --bg-base: #080b0f;
            --bg-elevated: #0d1117;
            --bg-hover: #161c25;
            --brand-yellow: #fcd535;
            --brand-yellow-dim: rgba(252, 213, 53, 0.08);
            --text-primary: #e6e9ef;
            --text-secondary: #5e6a7a;
            --text-muted: #3a4554;
            --border-light: #1e2733;
            --border-subtle: #151d27;
            --trade-green: #0ecb81;
            --trade-red: #f6465d;
            --sidebar-width: 240px;
            --sidebar-collapsed-width: 64px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-base);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
            overflow: -moz-scrollbars-none;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.45;
        }

        .app-container {
            position: relative;
            z-index: 1;
            display: flex;
            width: 100%;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-elevated);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease, transform 0.3s ease;
            overflow: hidden;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .sidebar.collapsed {
            width: var(--sidebar-collapsed-width);
        }

        .sidebar-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 22px 0 18px;
            cursor: pointer;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-light);
            transition: color 0.2s;
        }

        .sidebar-toggle svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .sidebar-toggle:hover {
            color: var(--brand-yellow);
        }

        .sidebar-nav {

            padding: 16px 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;

            align-items: center;
            gap: 11px;
            padding: 10px 14px;
            border-radius: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 500;
            transition: background 0.2s, color 0.2s, transform 0.15s;
            white-space: nowrap;
        }

        .sidebar-nav a:hover {
            background: var(--brand-yellow-dim);
            color: var(--brand-yellow);
            transform: translateX(2px);
        }

        .sidebar-nav a.active {
            background: var(--brand-yellow-dim);
            color: var(--brand-yellow);
        }

        .sidebar.collapsed .sidebar-nav a {
            padding: 12px 0;
            justify-content: center;
            gap: 0;
        }

        .sidebar.collapsed .sidebar-nav a .nav-text {
            display: none;
        }

        .sidebar.collapsed .sidebar-nav a .nav-icon svg {
            width: 20px;
            height: 20px;
        }

        .sidebar-nav a .nav-icon {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .sidebar-nav a .nav-icon svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;

        .sidebar-footer {

        select {

            }

    <script>
        const SUPABASE_URL = 'https://clwgengvcdokdzubdfxd.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsd2dlbmd2Y2Rva2R6dWJkZnhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MTIxNjEsImV4cCI6MjA5MzQ4ODE2MX0.0zgizWWXLIHiKdNUAJ3yKaIaxEKsHoFeEIo8IUAMtHU';

        const ASSETS = [
            { symbol: 'USDC', name: 'USD Coin', icon: '₿' },
            { symbol: 'USDT', name: 'Tether', icon: '₮' },
            { symbol: 'ETH', name: 'Ethereum', icon: '⟠' },
            { symbol: 'SOL', name: 'Solana', icon: '◎' },
            { symbol: 'SUI', name: 'Sui', icon: '▲' },
            { symbol: 'APT', name: 'Aptos', icon: '◆' },
            { symbol: 'DAI', name: 'Dai', icon: '◈' },
            { symbol: 'WBTC', name: 'Wrapped BTC', icon: '₿' },
        ];

        const CHAIN_MAP = {
            'USDC': ['base-sepolia', 'base', 'ethereum-sepolia', 'ethereum', 'polygon-amoy', 'polygon', 'solana', 'aptos', 'sui'],
            'USDT': ['base-sepolia', 'base', 'ethereum-sepolia', 'ethereum', 'polygon-amoy', 'polygon', 'solana'],
            'ETH': ['base-sepolia', 'base', 'ethereum-sepolia', 'ethereum', 'polygon-amoy', 'polygon', 'arbitrum-sepolia', 'arbitrum', 'optimism-sepolia', 'optimism'],
            'SOL': ['solana'],
            'SUI': ['sui'],
            'APT': ['aptos'],
            'DAI': ['base-sepolia', 'base', 'ethereum-sepolia', 'ethereum', 'polygon-amoy', 'polygon'],
            'WBTC': ['base-sepolia', 'base', 'ethereum-sepolia', 'ethereum', 'polygon-amoy', 'polygon'],
        };

        const CHAIN_NAMES = {
            'base-sepolia': 'Base Sepolia',
            'base': 'Base',
            'ethereum-sepolia': 'Ethereum Sepolia',
            'ethereum': 'Ethereum',
            'polygon-amoy': 'Polygon Amoy',
            'polygon': 'Polygon',
            'arbitrum-sepolia': 'Arbitrum Sepolia',
            'arbitrum': 'Arbitrum',
            'optimism-sepolia': 'Optimism Sepolia',
            'optimism': 'Optimism',
            'solana': 'Solana',
            'aptos': 'Aptos',
            'sui': 'Sui',
        };

        let supabaseClient;
        let currentUser = null;
        let selectedAsset = null;
        let generatedAddress = '';

        const sidebar = document.getElementById('sidebar');
        if (localStorage.getItem('sidebarCollapsed') === 'true') sidebar.classList.add('collapsed');

        function toggleSidebar() {
            sidebar.classList.toggle('collapsed');
            localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
        }

        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const numParticles = 80;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.8 + 0.4;
                this.speedX = (Math.random() * 0.8) - 0.4;
                this.speedY = (Math.random() * 0.8) - 0.4;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = '#D4AF37';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#D4AF37';
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < numParticles; i++) particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 130) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(212, 175, 55, ${0.15 - distance / 866})`;
                        ctx.lineWidth = 0.5;
                        ctx.shadowBlur = 0;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }
        initParticles();
        animateParticles();

        async function init() {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            if (error || !session) {
                window.location.href = './pl.html';
                return;
            }
            currentUser = session.user;
            document.getElementById('user-initials').textContent = (currentUser.email[0] || 'U').toUpperCase();
            document.getElementById('user-fullname').textContent = currentUser.email.split('@')[0];
            document.getElementById('user-email-display').textContent = currentUser.email;
            renderAssets();
        }

        function renderAssets() {
            const grid = document.getElementById('assetGrid');
            grid.innerHTML = '';
            ASSETS.forEach(asset => {
                const card = document.createElement('div');
                card.className = 'asset-card';
                card.innerHTML = `
                    <div class="icon">${asset.icon}</div>
                    <div class="symbol">${asset.symbol}</div>
                    <div class="name">${asset.name}</div>
                    <button class="btn btn-primary" data-symbol="${asset.symbol}">Add Asset</button>
                `;
                card.querySelector('button').addEventListener('click', (e) => {
                    e.stopPropagation();
                    openModal(asset.symbol);
                });
                grid.appendChild(card);
            });
        }

        function openModal(symbol) {
            selectedAsset = symbol;
            document.getElementById('modalAssetSymbol').textContent = symbol;
            document.getElementById('modalTitle').textContent = `Add ${symbol}`;
            document.getElementById('modalDesc').innerHTML = `Select a chain for <strong>${symbol}</strong>.`;

            const chains = CHAIN_MAP[symbol] || [];
            const select = document.getElementById('chainSelect');
            select.innerHTML = '';
            chains.forEach(chain => {
                const opt = document.createElement('option');
                opt.value = chain;
                opt.textContent = CHAIN_NAMES[chain] || chain;
                select.appendChild(opt);
            });

            document.getElementById('addressContainer').classList.add('hidden');
            document.getElementById('addressDisplay').textContent = '';
            document.getElementById('errorDisplay').classList.add('hidden');
            document.getElementById('errorDisplay').textContent = '';
            const generateBtn = document.getElementById('generateBtn');
            generateBtn.textContent = 'Generate Address';
            generateBtn.onclick = generateAddress;
            generateBtn.disabled = false;

            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        async function getFreshToken() {
            const { data: { session }, error } = await supabaseClient.auth.refreshSession();
            if (error || !session) {
                const { data: { session: newSession }, error: newError } = await supabaseClient.auth.getSession();
                if (newError || !newSession) {
                    window.location.href = './pl.html';
                    throw new Error('No valid session');
                }
                return newSession.access_token;
            }
            return session.access_token;
        }

        async function generateAddress() {
            const asset = selectedAsset;
            const chain = document.getElementById('chainSelect').value;
            if (!asset || !chain) {
                showError('Please select a chain.');
                return;
            }

            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            btn.textContent = 'Generating...';
            document.getElementById('errorDisplay').classList.add('hidden');

            try {
                const token = await getFreshToken();
                const response = await fetch(`${SUPABASE_URL}/functions/v1/wallet-operations`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        action: 'getOrCreate',
                        asset: asset,
                        chain: chain
                    })
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to generate address');
                }

                generatedAddress = data.address;
                document.getElementById('addressDisplay').textContent = generatedAddress;
                document.getElementById('addressContainer').classList.remove('hidden');
                document.getElementById('modalDesc').innerHTML =
                    `Your deposit address for <strong>${asset}</strong> on <strong>${CHAIN_NAMES[chain] || chain}</strong> is ready!`;
                btn.textContent = 'Generate Another';
                btn.onclick = () => {
                    document.getElementById('addressContainer').classList.add('hidden');
                    document.getElementById('addressDisplay').textContent = '';
                    document.getElementById('modalDesc').innerHTML = `Select a chain for <strong>${asset}</strong>.`;
                    btn.textContent = 'Generate Address';
                    btn.onclick = generateAddress;
                };
                btn.disabled = false;

            } catch (err) {
                showError(err.message);
                btn.disabled = false;
                btn.textContent = 'Generate Address';
            }
        }

        function showError(msg) {
            const el = document.getElementById('errorDisplay');
            el.textContent = msg;
            el.classList.remove('hidden');
        }

        function copyAddress() {
            navigator.clipboard.writeText(generatedAddress);
            alert('Address copied!');
        }

        function logout() {
            supabaseClient.auth.signOut().then(() => window.location.href = './pl.html');
        }

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modal')) closeModal();
        });

        init();
    </script>
</body>

</html>
